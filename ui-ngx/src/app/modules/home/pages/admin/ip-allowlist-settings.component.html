<mat-card appearance="outlined" class="settings-card">
  <mat-card-header>
    <mat-card-title>
      <span class="mat-headline-5" translate>admin.ip-allowlist.ip-allowlist</span>
    </mat-card-title>
    <span class="flex-1"></span>
    <div tb-help="ipAllowlistSettings"></div>
  </mat-card-header>
  @if (isLoading$ | async) {
    <mat-progress-bar color="warn" mode="indeterminate">
    </mat-progress-bar>
  } @else {
    <div style="height: 4px;"></div>
  }
  <mat-card-content>
    <form [formGroup]="ipAllowlistFormGroup" (ngSubmit)="save()" autocomplete="off">
      <fieldset [disabled]="isLoading$ | async">
        <tb-string-items-list
          appearance="outline"
          formControlName="ipAllowlist"
          label="{{ 'admin.ip-allowlist.ip-allowlist' | translate }}"
          placeholder="{{ 'admin.ip-allowlist.entry-placeholder' | translate }}"
          hint="{{ 'admin.ip-allowlist.hint' | translate }}"
          [allowUserValue]="true">
        </tb-string-items-list>
        <div class="flex flex-row flex-wrap items-center justify-end gap-2" style="margin-top: 16px">
          <button mat-button color="primary"
                  [disabled]="ipAllowlistFormGroup.pristine"
                  (click)="discardSetting()"
                  type="button">{{'action.undo' | translate}}
          </button>
          <button mat-button mat-raised-button color="primary"
                  [disabled]="(isLoading$ | async) || ipAllowlistFormGroup.invalid || !ipAllowlistFormGroup.dirty"
                  type="submit">{{'action.save' | translate}}
          </button>
        </div>
      </fieldset>
    </form>
  </mat-card-content>
</mat-card>
